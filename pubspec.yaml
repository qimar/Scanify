name: qr_scanner_app
description: Offline QR and barcode scanner and generator for Android built with Flutter.


# change_app_name:
#   name: "Scanify"

publish_to: 'none'
version: 1.0.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.3.0
  permission_handler: ^11.3.0
  change_app_package_name: ^1.5.0
  icons_launcher: ^3.0.3
  flutter_native_splash: ^2.4.7
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.5
  google_mobile_ads: ^5.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_animate: ^4.5.0
  image_picker: ^1.2.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  gal: ^2.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  # change_app_name: ^1.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/


flutter_native_splash:
  color: "#111111"
  image: "assets/icons/splash.png" 
  android: true
  ios: true
  fullscreen: true
  
  android_12:
    image: "assets/icons/splash.png" 



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png" 
  adaptive_icon_background: "#111111"         
  adaptive_icon_foreground: "assets/icons/icon.png"



